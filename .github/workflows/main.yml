name: Verify Human Identity
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd scripts && npm install

      - name: Run Script
        run: |
          node scripts/createNewEthereumIdentity.js
      
      - name: Generate Billions Verification Link
        run: |
             node scripts/manualLinkHumanToAgent.js --challenge '{"name": "My Verified Agent", "description": "Agent terverifikasi"}'


